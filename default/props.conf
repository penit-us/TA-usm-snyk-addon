[snyk:audit:log]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "created"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 25
TRUNCATE = 100000

[snyk:rest:issues]
SHOULD_LINEMERGE = false
KV_MODE = json
TIME_PREFIX = "created_at"\s*:\s*"
TIME_FORMAT = %Y-%m-%dT%H:%M:%SZ
MAX_TIMESTAMP_LOOKAHEAD = 30
TRUNCATE = 500000

[snyk:rest:project]
SHOULD_LINEMERGE = false
KV_MODE = json
TRUNCATE = 200000

# TIME_PREFIX/TIME_FORMAT intentionally not set yet -- pending a real sample
# response from GET /rest/orgs/{org_id}/projects to confirm the actual
# timestamp field name (likely "created" or "attributes.created" but not
# verified). Falls back to index time until confirmed.
